<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06080f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1220'/%3E%3Cpath d='M10 24V12l14-3v11' stroke='%23f6c768' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='10' cy='24' r='2.6' fill='%23f6c768'/%3E%3Ccircle cx='24' cy='20' r='2.6' fill='%23f6c768'/%3E%3C/svg%3E">
  <title>Harmonix · Bibliothèque musicale</title>
  <script>
    // Applique le thème avant le premier paint (anti-flash).
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('harmonix:theme') || 'null');
        var r = document.documentElement;
        if (t && t.gold) r.style.setProperty('--gold', t.gold);
        if (t && t.goldLight) r.style.setProperty('--gold-light', t.goldLight);
        if (t && t.bgDark) { r.style.setProperty('--bg-dark', t.bgDark); }
        if (t && t.bgSurface) { r.style.setProperty('--bg-surface', t.bgSurface); r.style.setProperty('--bg-elevated', t.bgSurface); }
        if (t && t.text) r.style.setProperty('--text', t.text);
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <!-- Harmonix héberge et organise une bibliothèque personnelle de musiques créées avec Suno. -->
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
