<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f2b">
  <meta name="description" content="Harmonix V5 : votre bibliothèque musicale Sonora, vos playlists, vos favoris et vos paroles dans le navigateur.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/branding/Icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/branding/favicon.png">
  <title>Harmonix V5 · Votre musique</title>
  <script>
    // Applique le thème avant le premier paint (anti-flash).
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('harmonix:v5:theme') || 'null');
        var r = document.documentElement;
        if (t && t.gold) r.style.setProperty('--gold', t.gold);
        if (t && t.goldLight) r.style.setProperty('--gold-light', t.goldLight);
        if (t && t.bgDark) { r.style.setProperty('--bg-dark', t.bgDark); }
        if (t && t.bgSurface) { r.style.setProperty('--bg-surface', t.bgSurface); r.style.setProperty('--bg-elevated', t.bgSurface); }
        if (t && t.text) r.style.setProperty('--text', t.text);
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <!-- Harmonix héberge et organise une bibliothèque personnelle de musiques créées avec Suno. -->
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
